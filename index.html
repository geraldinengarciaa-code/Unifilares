<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Edición Unifilares - ABB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <!-- jsPDF for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- PDF-Lib for merging PDFs -->
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <!-- Lucide Icons via unpkg -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        abbred: '#FF000F',
                        abbgray: '#F4F4F4',
                        abbdark: '#222222'
                    },
                    fontFamily: {
                        abb: ['"ABBvoice"', '"ABB Voice"', 'Helvetica', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-abbgray font-abb text-abbdark h-screen flex flex-col overflow-hidden">
    <!-- Navbar -->
    <header class="bg-abbred text-white p-4 flex justify-between items-center shadow-md z-10 w-full relative">
        <div class="flex items-center gap-3">
            <h1 class="text-2xl font-bold tracking-wide">ABB Plataforma Unifilar</h1>
        </div>
        <div class="flex items-center gap-2">
            <select id="exportFormat" class="bg-white text-abbdark border border-gray-200 px-3 py-2 rounded text-sm font-medium outline-none cursor-pointer">
                <option value="html">Proyecto HTML (Interactivo + Editable)</option>
                <option value="pdf">Documento PDF</option>
                <option value="png">Imagen PNG</option>
            </select>
            <button id="btnExport" class="bg-white text-abbred px-4 py-2 rounded font-semibold hover:bg-gray-100 transition shadow flex items-center gap-2">
                <i data-lucide="download" class="w-5 h-5"></i> Descargar
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden w-full relative">
        <!-- Sidebar -->
        <aside class="w-72 bg-white border-r border-gray-200 p-5 flex flex-col gap-6 shadow-sm overflow-y-auto z-10 shrink-0">
            <div>
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Documento Base</h2>
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center cursor-pointer hover:bg-gray-50 transition border-abbred" id="dropzone">
                    <i data-lucide="upload-cloud" class="mx-auto mb-2 text-gray-400 w-8 h-8"></i>
                    <p class="text-sm text-gray-600 font-medium">Sube PDF o Imagen</p>
                    <p class="text-xs text-gray-400 mt-1">Haz clic o arrastra un archivo</p>
                    <input type="file" id="fileUpload" class="hidden" accept=".jpg,.jpeg,.png,.pdf,.html" />
                </div>
            </div>

            <!-- Nuevo Módulo PETS -->
            <div>
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Documento Adjunto (PETS)</h2>
                <button id="btnUploadPets" class="w-full bg-white border border-gray-300 p-2 text-sm text-gray-600 rounded hover:bg-gray-50 transition flex items-center justify-center gap-2 font-medium">
                    <i data-lucide="file-plus" class="w-4 h-4 text-blue-500"></i> Añadir PETS (PDF)
                </button>
                <input type="file" id="petsUpload" class="hidden" accept=".pdf" />
                <div id="petsStatus" class="hidden mt-2 p-2 bg-blue-50 border border-blue-100 rounded flex items-center gap-2">
                    <i data-lucide="check-circle" class="w-4 h-4 text-blue-500"></i>
                    <span id="petsFileName" class="text-xs text-blue-700 truncate font-semibold">Cargado</span>
                    <button id="btnRemovePets" class="ml-auto text-red-500 hover:text-red-700">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                </div>
            </div>

            <div id="toolsPanel" class="opacity-30 pointer-events-none transition-opacity duration-300 flex flex-col gap-6">
                <!-- Ajustes de Archivo -->
                <div>
                    <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Ajustes de Archivo</h2>
                    <div class="grid grid-cols-4 gap-2 mb-3">
                        <button id="btnRotateLeft" class="bg-gray-50 border border-gray-200 p-2 rounded hover:bg-gray-100 transition flex items-center justify-center text-xs font-medium" title="Rotar Izquierda">
                            <i data-lucide="rotate-ccw" class="w-4 h-4 text-abbdark"></i> 
                        </button>
                        <button id="btnRotateRight" class="bg-gray-50 border border-gray-200 p-2 rounded hover:bg-gray-100 transition flex items-center justify-center text-xs font-medium" title="Rotar Derecha">
                            <i data-lucide="rotate-cw" class="w-4 h-4 text-abbdark"></i> 
                        </button>
                        <button id="btnFlipH" class="bg-gray-50 border border-gray-200 p-2 rounded hover:bg-gray-100 transition flex items-center justify-center text-xs font-medium" title="Voltear Horizontal">
                            <i data-lucide="flip-horizontal" class="w-4 h-4 text-abbdark"></i> 
                        </button>
                        <button id="btnFlipV" class="bg-gray-50 border border-gray-200 p-2 rounded hover:bg-gray-100 transition flex items-center justify-center text-xs font-medium" title="Voltear Vertical">
                            <i data-lucide="flip-vertical" class="w-4 h-4 text-abbdark"></i> 
                        </button>
                    </div>
                    
                    <button id="btnStartCrop" class="w-full bg-gray-50 border border-gray-200 p-2 rounded hover:bg-gray-100 transition flex items-center justify-center gap-2 text-sm font-medium">
                        <i data-lucide="crop" class="w-4 h-4 text-abbdark"></i> Recortar
                    </button>
                    <div id="cropControls" class="hidden flex-col gap-2 mt-2">
                        <button id="btnApplyCrop" class="w-full bg-green-50 text-green-700 border border-green-200 p-2 rounded hover:bg-green-100 transition flex items-center justify-center gap-2 text-sm font-medium">
                            <i data-lucide="check" class="w-4 h-4"></i> Aplicar
                        </button>
                        <button id="btnCancelCrop" class="w-full bg-red-50 text-red-700 border border-red-200 p-2 rounded hover:bg-red-100 transition flex items-center justify-center gap-2 text-sm font-medium">
                            <i data-lucide="x" class="w-4 h-4"></i> Cancelar
                        </button>
                    </div>
                </div>

                <div>
                    <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Símbolos</h2>
                    <div class="grid grid-cols-2 gap-3">
                    <button class="add-symbol border border-gray-200 p-3 rounded hover:border-abbred hover:text-abbred transition flex flex-col items-center gap-2" data-type="aterramiento">
                        <div class="w-8 h-8 flex items-center justify-center">
                            <i data-lucide="zap" class="text-amber-500"></i>
                        </div>
                        <span class="text-xs font-semibold">Tierra</span>
                    </button>
                    <button class="add-symbol border border-gray-200 p-3 rounded hover:border-abbred hover:text-abbred transition flex flex-col items-center gap-2" data-type="aislamiento">
                        <div class="w-8 h-8 flex items-center justify-center">
                            <i data-lucide="shield" class="text-blue-500"></i>
                        </div>
                        <span class="text-xs font-semibold">Aislamiento</span>
                    </button>
                    <button class="add-symbol border border-gray-200 p-3 rounded hover:border-abbred hover:text-abbred transition flex flex-col items-center gap-2 col-span-2" data-type="bloqueo">
                        <div class="w-8 h-8 flex items-center justify-center">
                            <i data-lucide="lock" class="text-red-500"></i>
                        </div>
                        <span class="text-xs font-semibold">Bloqueo LOTO</span>
                    </button>
                </div>
                
                <div>
                    <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Herramientas</h2>
                    <button id="addText" class="w-full bg-gray-50 border border-gray-200 p-2 rounded hover:bg-gray-100 transition flex items-center justify-center gap-2 text-sm font-medium mb-3">
                        <i data-lucide="type" class="w-4 h-4 text-abbred"></i> Añadir Texto
                    </button>
                </div>
                
                <div id="propertiesPanel" class="hidden border-t border-gray-200 pt-4 mt-auto">
                    <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Propiedades</h2>
                    <div class="flex flex-col gap-3">
                        <div id="textOnlyProps" class="hidden flex-col gap-3">
                            <div>
                                <label class="text-xs font-medium text-gray-500 mb-1 block">Tamaño</label>
                                <input type="number" id="propFontSize" class="w-full border border-gray-200 rounded p-1.5 text-sm outline-none focus:border-abbred transition" value="24" min="8" max="150" title="Tamaño de letra">
                            </div>
                        </div>
                        <div>
                            <label class="text-xs font-medium text-gray-500 mb-1 block">Texto del elemento</label>
                            <input type="text" id="propSymbolText" class="w-full border border-gray-200 rounded p-1.5 text-sm outline-none focus:border-abbred transition" placeholder="Editar texto...">
                        </div>
                        <div>
                            <label class="text-xs font-medium text-gray-500 mb-1 block">Color</label>
                            <select id="propFillColor" class="w-full border border-gray-200 rounded p-1.5 text-sm outline-none focus:border-abbred transition cursor-pointer">
                                <option value="#000000">Negro</option>
                                <option value="#FF000F">Rojo</option>
                                <option value="#0000FF">Azul</option>
                                <option value="#FFFF00">Amarillo</option>
                                <option value="#008000">Verde</option>
                                <option value="#FFFFFF">Blanco</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="border-t border-gray-200 pt-4 mt-4">
                    <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Controles</h2>
                    <button id="btnDelete" class="w-full bg-red-50 text-red-600 border border-red-200 p-2 rounded hover:bg-red-100 transition flex items-center justify-center gap-2 text-sm disabled:opacity-50 disabled:cursor-not-allowed mb-3">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Eliminar Selección
                    </button>
                    <!-- Help message for Pan and Zoom -->
                    <div class="bg-blue-50 text-blue-700 p-3 rounded border border-blue-200 text-xs flex items-start gap-2">
                        <i data-lucide="mouse-pointer-2" class="w-4 h-4 shrink-0 mt-0.5"></i>
                        <div>
                            <p><strong>Rueda ratón</strong> navega (zoom).</p>
                            <p><strong>Clic derecho</strong> arrastra lienzo.</p>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Canvas Workspace -->
        <section class="flex-1 bg-gray-300 relative overflow-auto p-8 border-l border-gray-300" id="workspace">
            <div class="m-auto shadow-2xl bg-white transition-all w-fit relative" id="canvasContainer">
                <canvas id="fabricCanvas"></canvas>
            </div>
            <div id="welcomeMessage" class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
                <div class="bg-white/90 backdrop-blur px-6 py-4 rounded-xl shadow border border-gray-200 flex items-center gap-3">
                    <i data-lucide="info" class="text-blue-500"></i>
                    <p class="text-gray-600 font-medium text-lg">Carga un diagrama para comenzar</p>
                </div>
            </div>
        </section>
    </main>
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";</script>
    <script src="app.js"></script>
</body>
</html>
